name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar la carpeta www con los archivos de la app
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp privacidad.html www/privacidad.html

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: npx cap add android

      - name: ID de la app en AdMob (App ID, no el del banner)
        # Mientras no pongas el tuyo, usa el App ID de PRUEBA de Google.
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          ID="${ADMOB_APP_ID:-ca-app-pub-3940256099942544~3347511713}"
          sed -i "s#</application>#    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ID\"/>\n    </application>#" android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -n "APPLICATION_ID\|POST_NOTIFICATIONS" android/app/src/main/AndroidManifest.xml

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK de prueba
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: convertidor-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
